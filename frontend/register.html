<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | BASILMART</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f2ed;color:#171717;min-height:100vh}
.topbar{background:#171717;color:white;text-align:center;padding:11px;font-size:10px;letter-spacing:2px}
nav{height:75px;display:flex;align-items:center;justify-content:space-between;padding:0 7%;border-bottom:1px solid #ddd}
.logo{font-size:25px;font-weight:900;letter-spacing:-1.5px;color:#171717;text-decoration:none}
.navlinks{display:flex;gap:25px}
.navlinks a{color:#171717;text-decoration:none;font-size:11px;font-weight:bold;letter-spacing:1px}
main{min-height:calc(100vh - 130px);display:grid;grid-template-columns:1fr 1fr}
.visual{background:linear-gradient(#0002,#0005),url('https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1200&q=85') center/cover;display:flex;align-items:flex-end;padding:50px;color:white}
.visual h1{font-size:clamp(42px,6vw,78px);line-height:.92;letter-spacing:-4px;font-weight:900}
.visual p{font-size:11px;letter-spacing:2px;margin-bottom:18px}
.panel{display:flex;justify-content:center;align-items:center;padding:40px 8%}
.formbox{width:100%;max-width:410px}
.eyebrow{font-size:10px;letter-spacing:3px;font-weight:bold;color:#777;margin-bottom:15px}
h2{font-size:42px;letter-spacing:-2px;margin-bottom:12px}
.subtitle{font-size:13px;color:#777;margin-bottom:25px;line-height:1.6}
label{display:block;font-size:10px;letter-spacing:1.5px;font-weight:bold;margin:16px 0 8px}
input{width:100%;padding:14px;border:1px solid #d3d0ca;background:transparent;font-size:14px;outline:none}
input:focus{border-color:#171717}
button{margin-top:23px;width:100%;padding:17px;background:#171717;color:white;border:0;font-size:11px;font-weight:bold;letter-spacing:2px;cursor:pointer}
button:hover{background:#444}
button:disabled{opacity:.6;cursor:wait}
#message{font-size:13px;margin-top:15px;line-height:1.5}
.bottom{font-size:12px;color:#777;margin-top:23px;text-align:center}
.bottom a{color:#171717;font-weight:bold}
@media(max-width:700px){nav{padding:0 5%;height:65px}.navlinks{gap:12px}.navlinks a{font-size:9px}main{grid-template-columns:1fr}.visual{min-height:230px;padding:28px}.visual h1{font-size:50px}.panel{padding:35px 7%}}
</style>
</head>

<body>
<div class="topbar">FIND YOUR FIT. DEFINE YOUR STYLE. | BASILMART</div>

<nav>
<a class="logo" href="index.html">BASILMART®</a>
<div class="navlinks">
<a href="index.html">HOME</a>
<a href="products.html">SHOP</a>
<a href="login.html">LOGIN</a>
</div>
</nav>

<main>
<section class="visual">
<div>
<p>YOUR NEXT CHAPTER STARTS HERE</p>
<h1>MAKE<br>IT<br>YOURS.</h1>
</div>
</section>

<section class="panel">
<div class="formbox">
<div class="eyebrow">JOIN THE COMMUNITY</div>
<h2>Create account.</h2>
<p class="subtitle">Create your BASILMART account and discover your everyday style.</p>

<form id="registerForm">
<label for="name">FULL NAME</label>
<input id="name" name="name" type="text" placeholder="Enter your name" required>

<label for="email">EMAIL ADDRESS</label>
<input id="email" name="email" type="email" placeholder="you@example.com" required>

<label for="password">PASSWORD</label>
<input id="password" name="password" type="password" placeholder="Create a password" minlength="6" required>

<button id="registerButton" type="submit">CREATE ACCOUNT →</button>
</form>

<p id="message" role="status"></p>
<div class="bottom">Already have an account? <a href="login.html">Sign in</a></div>
</div>
</section>
</main>

<script src="config.js"></script>
<script>
const API_URL = (typeof window !== "undefined" && window.API_URL) ? window.API_URL : "http://localhost:8080";
const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.style.color = "#555";
    message.textContent = "Creating your account...";
    button.disabled = true;

    try {
        const response = await fetch(`${API_URL}/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams({
                name: name,
                email: email,
                password: password
            })
        });

        const responseText = await response.text();
        let data;

        try {
            data = JSON.parse(responseText);
        } catch {
            throw new Error("Server returned an unexpected response. Check the backend route.");
        }

        if (!response.ok || data.success === false) {
            throw new Error(data.message || "Registration failed. Please try again.");
        }

        message.style.color = "green";
        message.textContent = data.message || "Account created successfully! You can sign in now.";
        form.reset();

    } catch (error) {
        message.style.color = "#c62828";

        if (error.message === "Failed to fetch") {
            message.textContent = "Cannot connect to BasilMart backend. Check whether the server is running.";
        } else {
            message.textContent = error.message;
        }
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
